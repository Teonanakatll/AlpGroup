{% comment %}
Причина (списание, ремонт, не найден): метка «Причина» в цвете операции, текст — зелёным темы;
текст раскрывается под строкой при наведении на строку или касании метки (tabindex — для телефона).
Нужны: note, tone.
{% endcomment %}<div class="note"><span class="note-flag {{ tone }}" tabindex="0" title="{{ note }}">Причина</span><div class="row-note"><span><span>{{ note }}</span></span></div></div>
