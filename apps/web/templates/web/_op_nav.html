  {# Вкладки операций: у каждой своя иконка и цвет (OPERATION_TABS во views.py) #}
  <nav class="toolbar op-tabs reveal" style="--i:1" aria-label="Вид операции">
    {% for tab in op_tabs %}
      <a class="chip op-tab {{ tab.tone }}{% if tab.mode == mode %} is-active{% endif %}" href="{{ tab.url }}"{% if tab.mode == mode %} aria-current="page"{% endif %}>
        <svg class="icon" aria-hidden="true"><use href="#i-{{ tab.icon }}"/></svg>{{ tab.label }}
      </a>
    {% endfor %}
  </nav>
