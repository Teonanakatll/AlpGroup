# Три контейнера: db (PostgreSQL), web (Django + gunicorn), caddy (https, статика, фото).
# Запуск: docker compose up -d --build   (настройки берутся из .env, см. docs/DEPLOY.md)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db          # внутри compose база доступна по имени сервиса
      DB_PORT: "5432"
      DEBUG: "0"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static:/app/staticfiles
      - media:/app/media

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - static:/srv/static:ro
      - media:/srv/media:ro
      - caddy_data:/data       # здесь лежат сертификаты: не терять между запусками
      - caddy_config:/config

volumes:
  pgdata:
  static:
  media:
  caddy_data:
  caddy_config:
